<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CarePulse · Your personal care agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shared CareCatalyst design tokens (docs/design-system.md) */
      :root {
        --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #6b6b6b;
        --line: #e6e6e6;
        --surface: #f5f5f5;
        --red: #e5262b; /* risk, missed, cancelled */
        --blue: #1f5eff; /* action, agent, info */
        --green: #14a44d; /* done, booked, started */
        --yellow: #ffc400; /* pending, waiting */
        --red-soft: #fdeaea;
        --blue-soft: #e8efff;
        --green-soft: #e6f6ec;
        --yellow-soft: #fff6d6;
        --radius: 20px;
        --radius-sm: 12px;
        --pill: 999px;
        --gutter: clamp(20px, 5vw, 72px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
      }
      @media (min-width: 1025px) {
        body {
          font-size: 17px;
        }
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      h1 {
        font-size: clamp(32px, 4vw, 40px);
        font-weight: 800;
        margin: 8px 0 16px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
      }

      /* Legacy tab views (app.js). Replaced by pitch mode on load. */
      .shell {
        min-height: 100dvh;
        position: relative;
        padding-bottom: 100px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px var(--gutter);
      }
      .brand {
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        background: var(--blue);
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        margin-right: 10px;
      }
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 14px;
        font-weight: 700;
      }
      main {
        padding: 0 var(--gutter);
      }
      .hero {
        margin: 24px 0;
        padding: 28px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
      }
      .hero h2 {
        font-size: 28px;
        margin: 0 0 16px;
      }
      .progress {
        position: relative;
        height: 32px;
        background: var(--surface);
        border-radius: var(--pill);
        overflow: hidden;
      }
      .progress span {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--green);
        transition: width 0.2s;
      }
      .progress b {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
      }
      .section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 32px 0 12px;
      }
      h3 {
        font-size: 20px;
        margin: 0;
      }
      .link {
        border: 0;
        background: none;
        color: var(--blue);
        font-size: 16px;
        font-weight: 600;
        min-height: 44px;
      }
      .card {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
      }
      main > .card {
        margin: 12px 0;
      }
      .medrow {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .medicon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: var(--radius-sm);
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 22px;
      }
      .card h4 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .card p {
        margin: 0;
      }
      .badge {
        font-size: 14px;
        padding: 4px 12px;
        background: var(--surface);
        border-radius: var(--pill);
        display: inline-block;
      }
      .medfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        border-top: 1px solid var(--line);
        margin-top: 16px;
        padding-top: 14px;
      }
      .take {
        border: 1px solid var(--line);
        border-radius: var(--pill);
        background: var(--bg);
        font-size: 15px;
        min-height: 44px;
        padding: 0 16px;
      }
      .take.done {
        background: var(--green-soft);
        border-color: var(--green);
      }
      .visitbutton {
        width: 100%;
        margin-top: 16px;
        min-height: 48px;
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: var(--pill);
        color: var(--blue);
        font-size: 16px;
        font-weight: 600;
      }
      .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-around;
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
        background: var(--bg);
        border-top: 1px solid var(--line);
        z-index: 2;
      }
      .nav button {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 4px;
        border: 0;
        background: none;
        font-size: 14px;
        color: var(--muted);
        min-height: 52px;
        width: 24%;
      }
      .nav button.active {
        color: var(--blue);
        font-weight: 700;
      }
      .nav svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      /* Dialog (shared by legacy views and the agent picker) */
      dialog {
        border: 0;
        border-radius: var(--radius);
        padding: 28px;
        max-width: 440px;
        width: calc(100% - 40px);
        max-height: 90dvh;
        overflow: auto;
        color: var(--fg);
        font-family: var(--font);
      }
      dialog::backdrop {
        background: rgb(10 10 10 / 0.35);
      }
      dialog h2 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      dialog button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: var(--pill);
        min-height: 48px;
        padding: 0 24px;
        width: 100%;
        font-weight: 600;
      }
      dialog label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      dialog input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        min-height: 48px;
        padding: 0 14px;
        font-size: 16px;
      }
      dialog .secondary {
        background: var(--surface);
        color: var(--fg);
        margin-top: 10px;
      }
      #form-error {
        color: var(--red);
        font-size: 14px;
      }
    </style>
    <link rel="stylesheet" href="pitch.css" />
    <link rel="stylesheet" href="glass.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand"><span class="logo">+</span>carepulse</div>
        <button class="avatar" aria-label="Open profile" onclick="setTab(3)">
          AM
        </button>
      </header>
      <main id="content"></main>
      <nav class="nav" aria-label="Main navigation"></nav>
    </div>
    <dialog id="details">
      <h2>Annual wellness visit</h2>
      <p>November 18, 2026 · 10:30<br />Dr. Sarah Chen</p>
      <button onclick="document.querySelector('dialog').close()">Done</button>
    </dialog>
    <script src="app.js"></script>
    <script src="pitch.js"></script>
  </body>
</html>
